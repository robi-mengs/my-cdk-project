name: CI

# Runs on every pull request. Needs no AWS access: tests and synth are local.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          npm install -g aws-cdk

      - name: Run tests
        run: pytest -q

      - name: Synthesize
        run: cdk synth --strict -c owner=ci > /dev/null
